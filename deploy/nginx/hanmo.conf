# 翰墨学堂 Nginx 配置模板
# 使用前替换：
#   hanmo.example.com → 你的备案域名
#   证书路径 → certbot 实际生成路径
#
# 放置位置（Ubuntu）：
#   /etc/nginx/sites-available/hanmo.conf
# 启用：
#   ln -s /etc/nginx/sites-available/hanmo.conf /etc/nginx/sites-enabled/hanmo.conf
# 检查并重载：
#   nginx -t && systemctl reload nginx

limit_req_zone $binary_remote_addr zone=hanmo_api:10m rate=20r/s;

server {
    listen 80;
    listen [::]:80;
    server_name hanmo.example.com;

    # certbot 续期验证
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name hanmo.example.com;

    ssl_certificate     /etc/letsencrypt/live/hanmo.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hanmo.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # 安全响应头
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "geolocation=(self)" always;

    # 管理端静态文件
    root /var/www/hanmo-admin;
    index index.html;
    client_max_body_size 20m;

    access_log /var/log/nginx/hanmo.access.log;
    error_log  /var/log/nginx/hanmo.error.log warn;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # 管理端 SPA
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # 前端静态资源长缓存（Vite 文件名带 hash）
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 后端 API
    location /api/ {
        limit_req zone=hanmo_api burst=40 nodelay;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_buffering off;
    }

    # 上传文件由 Nginx 直接提供，减少 Java 压力
    location /uploads/ {
        alias /data/hanmo/uploads/;
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # 健康检查仅允许本机
    location = /actuator/health {
        allow 127.0.0.1;
        deny all;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
    }

    # 生产环境默认不开放 Swagger；如临时排障确需开放，再取消注释并限制来源 IP
    # location /swagger-ui/ {
    #     allow 你的办公公网IP;
    #     deny all;
    #     proxy_pass http://127.0.0.1:8080;
    # }
    # location /v3/api-docs {
    #     allow 你的办公公网IP;
    #     deny all;
    #     proxy_pass http://127.0.0.1:8080;
    # }
}
